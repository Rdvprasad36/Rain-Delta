[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "monsoon"
version = "1.0.0"
description = "MonsoonDelta — ECMWF IFS/AIFS precipitation forecast revision for Bay of Bengal"
authors = [{name = "Durga Venkata Prasad Rapeti", email = "rdvprasad36@gmail.com"}]
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "numpy>=2.0",
  "xarray>=2025.1",
  "scipy>=1.13",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --timeout=30"
pythonpath = ["src", "."]
